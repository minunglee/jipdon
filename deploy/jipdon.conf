# jipdon.com: 집돈 계산기 (정적 사이트)
# 서버의 app/nginx/ 에 올라가 게이트웨이 저장소의 00-common.conf(TLS 공통 설정)와 함께 읽힌다.
# 파일 위치: 컨테이너 /var/www/sites/jipdon/current → releases/<커밋> (배포마다 링크만 바꿔 끼운다)

# 실거래가 조회 API(/api/)는 IP마다 초당 5회(순간 20회)까지만 받는다
limit_req_zone $binary_remote_addr zone=jipdon_api:5m rate=5r/s;

# HTTP: 인증서 발급·갱신 확인 경로만 열고 나머지는 HTTPS 본 주소로
server {
    listen 80;
    server_name jipdon.com www.jipdon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jipdon.com$request_uri;
    }
}

# www는 본 주소로 통일 (검색엔진에 주소가 둘로 나뉘지 않게)
server {
    listen 443 ssl;
    http2 on;
    server_name www.jipdon.com;

    ssl_certificate /etc/letsencrypt/live/jipdon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jipdon.com/privkey.pem;

    return 301 https://jipdon.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jipdon.com;

    ssl_certificate /etc/letsencrypt/live/jipdon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jipdon.com/privkey.pem;

    # 아래 location마다 add_header를 쓰면 바깥 것은 상속되지 않으므로 보안 헤더는 각 location에 둔다
    root /var/www/sites/jipdon/current;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # 빌드 산출물은 파일 이름에 내용 해시가 붙어 있어 오래 캐시해도 안전하다
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 실거래가 조회 API → jipdon-api 컨테이너 (같은 Docker 네트워크)
    # 주소를 변수로 두고 Docker DNS로 요청 때마다 찾는다. 그래야 API 컨테이너가 꺼져 있어도 Nginx가 뜨고 다른 사이트는 정상 동작한다
    location /api/ {
        limit_req zone=jipdon_api burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $jipdon_api http://jipdon-api:8090;
        proxy_pass $jipdon_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML은 배포 즉시 바뀌어야 하므로 매번 확인
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
